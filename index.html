<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindAR 图像识别</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true" 
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <!-- 加载 GLB 模型 -->
        <a-assets>
            <a-asset-item id="model" src="./model.glb"></a-asset-item>
        </a-assets>

        <!-- 当识别到目标图片时，在该位置显示模型 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#model"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
